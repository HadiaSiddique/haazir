<!doctype html>
<html><head><meta charset="utf-8"><title>Haazir cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 675px; overflow: hidden; font-family: Inter, sans-serif; }
  .wrap { position: relative; width: 1200px; height: 675px; background: linear-gradient(160deg, #0b6e69, #08524e); color: #fff; }
  .top { padding: 56px 64px 0; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; }
  .mark { width: 54px; height: 54px; border-radius: 14px; background: #fff; color: #0b6e69; display: grid; place-items: center; font-size: 34px; }
  .ur { font-family: "Noto Nastaliq Urdu", serif; font-size: 30px; opacity: .85; margin-inline-start: 6px; }
  h1 { font-size: 66px; line-height: 1.05; margin: 26px 0 14px; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #9ff0e6; }
  p { font-size: 25px; margin: 0; opacity: .92; max-width: 900px; line-height: 1.4; }
  .scene { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; }
  .scene svg { width: 1200px; height: 250px; display: block; }
</style></head>
<body><div class="wrap">
  <div class="top">
    <div class="logo"><span class="mark">✚</span>Haazir <span class="ur">حاضر</span></div>
    <h1>Know <em>before</em> you go.</h1>
    <p>Beds, doctors on duty, machines, medicines and blood across Lahore's hospitals, in one Urdu or English search.</p>
  </div>
  <div class="scene" id="scene"></div>
</div>
<script src="../frontend/art.js"></script>
<script>document.getElementById("scene").innerHTML = window.HAAZIR_ART.scene;</script>
</body></html>
